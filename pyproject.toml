[project]
name = "taskflow-hard-bug-challenge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pytest>=8.0,<10.0",
  "httpx>=0.27,<1.0",
  "pytest-asyncio>=0.23,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
